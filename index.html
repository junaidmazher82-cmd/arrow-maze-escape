</style></head><body><main class="app"><header class="header"><div class="logo">✦ ARROW <span>ESCAPE</span></div><div class="pill" id="progress">1 / 200</div></header><section class="card stats" aria-label="Level statistics"><div class="stat"><small>LEVEL</small><strong id="levelText">001</strong></div><div class="stat"><small>MOVES</small><strong id="moves">0</strong></div><div class="stat"><small>BEST</small><strong id="best">—</strong></div><div class="stat"><small>STARS</small><strong id="stars">☆☆☆</strong></div><div class="pill" id="difficulty">EASY</div></section><div class="mode" role="group" aria-label="Game mode"><button id="traceBtn" class="active" aria-pressed="true">✍ TRACE PATH</button><button id="navigateBtn" aria-pressed="false">● MOVE DOT</button></div><section class="card board-wrap"><canvas id="board" class="board" aria-label="Maze board. Trace from the green start to the pink finish, or move with arrow keys." role="img"></canvas><div id="toast" class="toast" aria-live="polite"></div></section><p class="help" id="help">Drag from the green START to the pink EXIT. Follow arrows where shown.</p><div class="actions"><button class="action" id="restart">↻ Restart</button><button class="action" id="hint">✦ Hint</button><button class="action primary" id="next">Next →</button></div><div class="bottom"><button class="smallbtn" id="levelsBtn">☷ Levels</button><button class="smallbtn" id="undo">↶ Undo</button><button class="smallbtn" id="sound">♫ Sound On</button><button class="smallbtn" id="info">ⓘ How to play</button></div><div class="footer">NEON FLOW EDITION · 200 LEVELS · PLAY OFFLINE</div></main><div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="dialog" id="dialog"></div></div><script>
(()=>{'use strict';const TOTAL=200,KEY='arrow-maze-escape-neon-v3';const $=id=>document.getElementById(id);let save={unlocked:1,best:{},mode:'trace',sound:true};try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');save={...save,...x,best:x.best||{}}}catch{};let level=1,maze,path=[],pos=0,moves=0,dragging=false,hintUntil=0,animation=0,ac=null;const canvas=$('board'),ctx=canvas.getContext('2d');function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch{}}function rng(seed){let s=seed>>>0;return()=>{s=(Math.imul(1664525,s)+1013904223)>>>0;return s/4294967296}}const DIRS=[[0,-1],[1,0],[0,1],[-1,0]],ARROWS=['↑','→','↓','←'];function generate(n){let size=Math.min(11,5+2*Math.floor((n-1)/40)),r=rng(n*718193+71),walls=Array.from({length:size*size},()=>[1,1,1,1]),seen=new Set([0]),stack=[0];while(stack.length){let a=stack[stack.length-1],x=a%size,y=Math.floor(a/size),opts=[];DIRS.forEach(([dx,dy],d)=>{let xx=x+dx,yy=y+dy,b=yy*size+xx;if(xx>=0&&xx<size&&yy>=0&&yy<size&&!seen.has(b))opts.push([b,d])});if(!opts.length){stack.pop();continue}let [b,d]=opts[Math.floor(r()*opts.length)];walls[a][d]=0;walls[b][(d+2)%4]=0;seen.add(b);stack.push(b)}let start=0,end=size*size-1,queue=[start],prev=Array(size*size).fill(-1);prev[start]=start;for(let i=0;i<queue.length;i++){let a=queue[i],x=a%size,y=Math.floor(a/size);DIRS.forEach(([dx,dy],d)=>{let xx=x+dx,yy=y+dy,b=yy*size+xx;if(!walls[a][d]&&prev[b]===-1){prev[b]=a;queue.push(b)}})}let solution=[end];while(solution[0]!==start)solution.unshift(prev[solution[0]]);let arrows={};for(let i=1;i<solution.length-1;i++){if(r()<Math.min(.55,.12+n/450)){let a=solution[i],b=solution[i+1],delta=b-a;arrows[a]=delta===1?1:delta===-1?3:delta===size?2:0}}return{size,walls,start,end,solution,arrows}}function load(n){level=Math.max(1,Math.min(TOTAL,n));maze=generate(level);path=[maze.start];pos=maze.start;moves=0;hintUntil=0;update();draw()}function update(){$('progress').textContent=save.unlocked+' / 200';$('levelText').textContent=String(level).padStart(3,'0');$('moves').textContent=moves;$('best').textContent=save.best[level]??'—';$('stars').textContent=save.best[level]===undefined?'☆☆☆':save.best[level]<=maze.solution.length-1?'★★★':save.best[level]<=maze.solution.length+3?'★★☆':'★☆☆';$('difficulty').textContent=level<=40?'EASY':level<=80?'MEDIUM':level<=140?'HARD':'EXPERT';$('traceBtn').classList.toggle('active',save.mode==='trace');$('navigateBtn').classList.toggle('active',save.mode==='navigate');$('traceBtn').setAttribute('aria-pressed',save.mode==='trace');$('navigateBtn').setAttribute('aria-pressed',save.mode==='navigate');$('help').textContent=save.mode==='trace'?'Drag from START to EXIT. Follow arrows where shown.':'Swipe, tap adjacent tiles, or use arrow keys to move the dot.';$('sound').textContent=save.sound?'♫ Sound On':'♫ Sound Off'}function sound(freq=520){if(!save.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.04,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.09);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.1)}catch{}}function toast(t){let e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1100)}function valid(a,b){if(a===b)return false;let x=a%maze.size,y=Math.floor(a/maze.size),xx=b%maze.size,yy=Math.floor(b/maze.size),d=DIRS.findIndex(([dx,dy])=>x+dx===xx&&y+dy===yy);return d>=0&&!maze.walls[a][d]&&(maze.arrows[a]===undefined||maze.arrows[a]===d)}function move(b){if(path.length>1&&b===path[path.length-2]){path.pop();pos=b;moves++;update();draw();sound(330);return}if(!valid(pos,b)){toast('Blocked! Try another route');sound(170);return}path.push(b);pos=b;moves++;sound(460);update();draw();if(pos===maze.end)win()}function win(){sound(880);save.best[level]=Math.min(save.best[level]??Infinity,moves);save.unlocked=Math.max(save.unlocked,Math.min(TOTAL,level+1));persist();update();let done=level===TOTAL;let stars=moves<=maze.solution.length-1?3:moves<=maze.solution.length+3?2:1;modal(`<div class="big">${done?'🏆':'🎉'}</div><div class="win-stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><h2>${done?'All 200 cleared!':'Maze escaped!'}</h2><p>Level ${level} complete in <b>${moves}</b> moves.<br>Best: ${save.best[level]} moves</p><button class="action primary" id="continue">${done?'Play again':'Next level →'}</button><button class="action" id="replay">Replay this level</button>`);$('continue').onclick=()=>{close();load(done?1:level+1)};$('replay').onclick=()=>{close();load(level)}}function modal(html){$('dialog').innerHTML=html;$('overlay').classList.add('open')}function close(){$('overlay').classList.remove('open')}function resize(){let dpr=Math.min(window.devicePixelRatio||1,2),w=canvas.getBoundingClientRect().width;canvas.width=Math.round(w*dpr);canvas.height=Math.round(w*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}function draw(){if(!maze)return;let w=canvas.getBoundingClientRect().width;if(!w)return;ctx.clearRect(0,0,w,w);let n=maze.size,pad=w*.045,cell=(w-2*pad)/n;ctx.fillStyle='#f8fbff';ctx.fillRect(0,0,w,w);let palette=['#f8fbff','#f0f5ff'];for(let y=0;y<n;y++)for(let x=0;x<n;x++){let a=y*n+x,px=pad+x*cell,py=pad+y*cell;ctx.fillStyle=palette[(x+y)%2];ctx.fillRect(px+1,py+1,cell-2,cell-2);if(maze.arrows[a]!==undefined){ctx.fillStyle='#ff9e32';ctx.font=`900 ${cell*.43}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ARROWS[maze.arrows[a]],px+cell/2,py+cell/2)}}const center=a=>[pad+(a%n+.5)*cell,pad+(Math.floor(a/n)+.5)*cell];function line(nodes,color,width){if(nodes.length<2)return;ctx.beginPath();nodes.forEach((a,i)=>{let [x,y]=center(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}if(Date.now()<hintUntil)line(maze.solution,'#b7a0ff99',cell*.22);line(path,'#398bff',cell*.22);for(let a=0;a<n*n;a++){let x=a%n,y=Math.floor(a/n),px=pad+x*cell,py=pad+y*cell;ctx.beginPath();for(let d=0;d<4;d++)if(maze.walls[a][d]){if(d===0){ctx.moveTo(px,py);ctx.lineTo(px+cell,py)}if(d===1){ctx.moveTo(px+cell,py);ctx.lineTo(px+cell,py+cell)}if(d===2){ctx.moveTo(px,py+cell);ctx.lineTo(px+cell,py+cell)}if(d===3){ctx.moveTo(px,py);ctx.lineTo(px,py+cell)}}ctx.strokeStyle='#25355b';ctx.lineWidth=Math.max(2,cell*.09);ctx.lineCap='round';ctx.stroke()}function marker(a,color,label){let [x,y]=center(a);ctx.beginPath();ctx.arc(x,y,cell*.29,0,Math.PI*2);ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=10;ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#122348';ctx.font=`900 ${cell*.27}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x,y)}marker(maze.start,'#3ce5b3','S');marker(maze.end,'#ff6f9c','E');if(pos!==maze.start&&pos!==maze.end)marker(pos,'#3c95ff','●');if(pos===maze.start){let [x,y]=center(pos);ctx.beginPath();ctx.arc(x,y,cell*.1,0,7);ctx.fillStyle='#fff';ctx.fill()}}function hit(e){let rect=canvas.getBoundingClientRect(),n=maze.size,pad=rect.width*.045,cell=(rect.width-2*pad)/n,x=Math.floor((e.clientX-rect.left-pad)/cell),y=Math.floor((e.clientY-rect.top-pad)/cell);return x>=0&&x<n&&y>=0&&y<n?y*n+x:-1}let lastTouch=null;canvas.addEventListener('pointerdown',e=>{if($('overlay').classList.contains('open'))return;canvas.setPointerCapture(e.pointerId);dragging=true;lastTouch={x:e.clientX,y:e.clientY};let a=hit(e);if(a>=0&&a!==pos&&valid(pos,a))move(a)});canvas.addEventListener('pointermove',e=>{if(!dragging||save.mode!=='trace')return;let a=hit(e);if(a>=0&&a!==pos&&valid(pos,a))move(a)});canvas.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;if(save.mode==='navigate'&&lastTouch){let dx=e.clientX-lastTouch.x,dy=e.clientY-lastTouch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>22){let d=Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0),x=pos%maze.size+DIRS[d][0],y=Math.floor(pos/maze.size)+DIRS[d][1];if(x>=0&&x<maze.size&&y>=0&&y<maze.size)move(y*maze.size+x)}else{let a=hit(e);if(a>=0&&a!==pos)move(a)}}});canvas.addEventListener('pointercancel',()=>dragging=false);window.addEventListener('keydown',e=>{if($('overlay').classList.contains('open')){if(e.key==='Escape')close();return}let d={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3}[e.key];if(d===undefined)return;e.preventDefault();let x=pos%maze.size+DIRS[d][0],y=Math.floor(pos/maze.size)+DIRS[d][1];if(x>=0&&x<maze.size&&y>=0&&y<maze.size)move(y*maze.size+x)});$('traceBtn').onclick=()=>{save.mode='trace';persist();update()};$('navigateBtn').onclick=()=>{save.mode='navigate';persist();update()};$('restart').onclick=()=>load(level);$('next').onclick=()=>{if(level<save.unlocked)load(level+1);else toast('Finish this level to unlock next')};$('hint').onclick=()=>{hintUntil=Date.now()+2800;draw();toast('Purple shows the solution');setTimeout(draw,2900)};$('undo').onclick=()=>{if(path.length>1){path.pop();pos=path[path.length-1];moves++;update();draw()}};$('sound').onclick=()=>{save.sound=!save.sound;persist();update()};$('levelsBtn').onclick=()=>{let cells=Array.from({length:TOTAL},(_,i)=>{let n=i+1;return `<button class="level ${save.best[n]!==undefined?'done':''} ${n===level?'current':''} ${n>save.unlocked?'locked':''}" data-level="${n}" ${n>save.unlocked?'disabled':''} aria-label="Level ${n}${n>save.unlocked?', locked':''}">${save.best[n]!==undefined?'✓ ':''}${n}</button>`}).join('');modal(`<h2>Choose a level</h2><p>Complete a level to unlock the next. ✓ means completed.</p><div class="levels">${cells}</div><button class="action" id="back">Close</button>`);$('back').onclick=close;$('dialog').querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{close();load(Number(b.dataset.level))})};$('info').onclick=()=>{modal('<h2>How to play</h2><p><b>Trace Path:</b> Drag your finger or mouse along open corridors from S to E.<br><br><b>Move Dot:</b> Swipe, tap a neighboring tile, or use arrow keys / WASD.<br><br>Gold arrows are one-way tiles: you must leave them in the arrow direction. Cyan shows your route. Purple hint reveals the solution briefly. Use Undo or Restart whenever you need.</p><button class="action primary" id="back">Let’s play!</button>');$('back').onclick=close};$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});window.addEventListener('resize',resize);load(1);requestAnimationFrame(resize)})();
